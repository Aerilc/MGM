name: hourly-update

# 每小时整点过 12 分自动抓取并重建页面 (cron 为 UTC, 每小时一次与时区无关);
# 高峰期 GitHub 可能延迟十几分钟, 对政策监测无影响。也可在 Actions 页手动触发。
on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl sources and build static page
        run: python build.py

      - name: Commit data and page if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json docs/index.html
          if git diff --cached --quiet; then
            echo "no changes this hour"
          else
            git commit -m "auto update $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') CST"
            git push
          fi
